services:
  - type: web
    name: guess-whose-song-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1 # Room ownership is intentionally single-instance until Pub/Sub is added.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: FIREBASE_PROJECT_ID
        value: guess-whose-song
      - key: REDIS_URL
        fromService:
          type: redis
          name: guess-whose-song-redis
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false  # Set as a deployment secret; never bake it into the image.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://guess-whose-song-server.onrender.com/spotify/callback
      - key: SPOTIFY_WEB_REDIRECT_URI
        value: https://guess-whose-song.web.app/
      - key: WEB_ORIGINS
        value: https://guess-whose-song.web.app,https://guess-whose-song.firebaseapp.com

  - type: redis
    name: guess-whose-song-redis
    plan: free
    ipAllowList: []  # Internal connections only
    maxmemoryPolicy: allkeys-lru
