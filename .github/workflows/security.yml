name: security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject web runtime configuration
        env:
          WEB_FIREBASE_CONFIG: ${{ secrets.WEB_FIREBASE_CONFIG }}
        run: |
          if [ -n "$WEB_FIREBASE_CONFIG" ]; then
            printf '%s' "$WEB_FIREBASE_CONFIG" > web/src/wasmJsMain/resources/firebase-config.js
          fi
      - name: Set production API origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("web/src/wasmJsMain/resources/firebase-config.js")
          config = path.read_text()
          config, replacements = re.subn(
              r'apiBaseUrl\s*:\s*["\'][^"\']+["\']',
              'apiBaseUrl: "https://guess-whose-song-server.onrender.com"',
              config,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("firebase-config.js must define exactly one apiBaseUrl")
          path.write_text(config)
          PY
      - name: Build and test
        run: ./gradlew :shared:compileKotlinJvm :server:test :server:shadowJar :app:assembleDebug :web:wasmJsBrowserDistribution --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guess-whose-song-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v3
        with:
          languages: kotlin
      - name: Compile server for CodeQL
        env:
          SERVER_ONLY: true
        run: ./gradlew :server:compileKotlin --no-daemon --stacktrace
      - uses: github/codeql-action/analyze@v3
