name: security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :shared:compileKotlinJvm :server:test :server:shadowJar :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guess-whose-song-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v3
        with:
          languages: kotlin
      - name: Compile server for CodeQL
        env:
          SERVER_ONLY: true
        run: ./gradlew :server:compileKotlin --no-daemon --stacktrace
      - uses: github/codeql-action/analyze@v3
