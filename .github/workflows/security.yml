name: security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject web runtime configuration
        env:
          WEB_FIREBASE_CONFIG: ${{ secrets.WEB_FIREBASE_CONFIG }}
        run: |
          if [ -n "$WEB_FIREBASE_CONFIG" ]; then
            printf '%s' "$WEB_FIREBASE_CONFIG" > web/src/wasmJsMain/resources/firebase-config.js
          fi
      - run: ./gradlew :shared:compileKotlinJvm :server:test :app:compileDebugKotlin :web:wasmJsBrowserDistribution --no-daemon

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: kotlin
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
