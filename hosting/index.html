<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131a">
    <meta name="robots" content="noindex">
    <title>Open Guess Whose Song</title>
    <link rel="stylesheet" href="/fallback.css">
    <script src="/fallback.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="brand-mark" aria-hidden="true">♪</div>
      <p class="eyebrow">GUESS WHOSE SONG</p>
      <h1>Join the room in the app</h1>
      <p id="room-message">Room invites open in the Android app.</p>
      <div id="room-code-wrap" class="room-code-wrap" hidden>
        <span>Room code</span>
        <strong id="room-code"></strong>
      </div>
      <a id="open-app" class="button primary" href="/" hidden>Open in app</a>
      <p class="hint">If the app is not installed, download it below, then open the room link again.</p>
      <a class="button secondary" href="https://github.com/Om-Anand-1208/Guess-Whose-Song/raw/refs/heads/main/artifacts/GuessWhoseSong.apk">
        Download Android app
      </a>
      <p class="footer">This game is played in the Android app.</p>
    </main>
  </body>
</html>
